<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Cage: Manager Ascension</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo">THE CAGE</div>
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1,000</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
        </div>
        <div style="margin-top: 10px; background: #334155; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; border: 1px solid #475569;">
            <div id="xp-bar" style="background: #f59e0b; width: 0%; height: 100%; transition: width 0.5s;"></div>
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; font-size: 0.7rem; margin-top: 5px; color: #94a3b8;">
            <span>Lvl <span id="gym-level-val">1</span></span>
            <span>Created: <b id="created-count">0</b>/8</span>
            <span>Purchased: <b id="purchased-count">0</b>/7</span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable</button>
            <button onclick="showView('shop')">🏗️ Shop</button>
            <button onclick="showView('market')">🛒 Market</button>
            <button onclick="showView('creator')">➕ Create</button>
            <button onclick="showView('history')">📜 Hall of Fame</button>
            <button onclick="openAdminConsole()" style="margin-top: 20px; color: #f59e0b; border: 1px dashed #f59e0b; font-size: 0.6rem;">🛡️ Coach Login</button>
            <button class="exit-btn" onclick="saveData()" style="margin-top: auto; color: #10b981;">💾 Save</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center; border: 2px solid #f59e0b;">
                    <h2 id="gym-name-display" contenteditable="true" onblur="updateGymName(this.innerText)">The Cage Gym</h2>
                    <p id="news-feed" style="color: #94a3b8;">Gym Operational. Advance week to refresh market & energy.</p>
                    <button class="btn-primary" onclick="processWeekReset()" style="width: 100%; height: 50px; font-size: 1.1rem; margin-top: 10px;">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <h1 style="color: #f59e0b;">🏆 GYM CLASH: WEEK <span id="tourney-week"></span></h1>
                <div id="tourney-status" style="margin-bottom: 20px;"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                    <div class="action-card"><h4>Your Selected Squad</h4><div id="selected-squad-list"></div></div>
                    <div class="action-card"><h4>Opponent Gym</h4><div id="opponent-squad-list"></div></div>
                </div>
                <button id="start-clash-btn" class="btn-primary" style="width: 100%; display: none; height: 50px;" onclick="runGymClash()">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>

            <section id="view-stable" class="view" style="display:none;"><div id="stable-list" class="grid-container"></div></section>
            <section id="view-shop" class="view" style="display:none;"><div id="shop-list" class="grid-container"></div></section>
            <section id="view-market" class="view" style="display:none;"><div id="market-list" class="grid-container"></div></section>
            <section id="view-creator" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Fighter Workshop</h3>
                    <input type="text" id="new-fighter-name" placeholder="Fighter Name..." class="custom-input">
                    <button class="btn-primary" onclick="createFighter()" style="width: 100%; margin-top: 10px;">Sign (💰500)</button>
                </div>
            </section>
            <section id="view-history" class="view" style="display:none;"><div id="history-list" class="grid-container"></div></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

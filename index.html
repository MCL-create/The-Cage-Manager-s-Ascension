<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CAGE - MMA MANAGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="clash-chime" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>

    <header class="top-nav">
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1300</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
            <span id="trophy-count" style="color: #fbbf24; margin-left:10px;"></span>
            
            <div class="xp-container">
                <div id="xp-bar-fill"></div>
            </div>
            <small style="font-size: 0.7rem; color: #fbbf24; margin-left: 5px;">LVL <span id="gym-level-val">1</span></small>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable</button>
            <button onclick="showView('market')">🛒 Market</button>
            <button onclick="showView('create')">➕ Create</button>
            <button onclick="showView('shop')">🏗️ Shop</button>
            <button onclick="showView('help')">❓ Help</button>
            <button onclick="saveData()" style="color: #10b981; margin-top: auto; border: 1px solid #10b981;">💾 Save</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center;">
                    <div id="logo-container" onclick="document.getElementById('gym-pic-upload').click()">
                        <img id="gym-logo-img" src="" style="display: none;">
                        <span id="pic-placeholder">UPLOAD LOGO</span>
                    </div>
                    <input type="file" id="gym-pic-upload" style="display: none;" accept="image/*" onchange="handleLogoUpload(this)">
                    <h2 id="gym-name-display">The Cage Gym</h2>
                    <div id="news-feed" class="news-box">Welcome, Coach.</div>
                    <button id="advance-btn" class="big-btn" onclick="processWeekReset()">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-stable" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">YOUR STABLE</h2>
                <div id="stable-list" class="grid-container"></div>
            </section>

            <section id="view-market" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">FIGHTER MARKET</h2>
                <div id="market-list" class="grid-container"></div>
            </section>

            <section id="view-shop" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">GYM UPGRADES</h2>
                <div id="shop-list" class="grid-container"></div>
            </section>

            <section id="view-create" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Workshop Recruit (💰500)</h3>
                    <input type="text" id="new-fighter-name" placeholder="Fighter Name..." class="styled-input">
                    <button onclick="createFighter()" class="buy-btn">SIGN CONTRACT</button>
                </div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <div id="tourney-status"></div>
                <button id="start-clash-btn" class="big-btn" onclick="runGymClash()" style="display:none; background: #10b981 !important;">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>

            <section id="view-help" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Manager's Manual</h3>
                    <p>• <b>Retire:</b> Remove fighters to free up space.</p>
                    <p>• <b>Market:</b> 15 new fighters arrive every week.</p>
                    <button onclick="forceHeal()" style="background: #3b82f6 !important; margin-top: 15px;">FIX STUCK BUTTONS</button>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CAGE - GYM MANAGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1300</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
            <span id="trophy-count" style="color: #fbbf24; font-weight: bold; margin-left: 15px;"></span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable</button>
            <button onclick="showView('create')">➕ Create</button>
            <button onclick="saveData()" style="color: #10b981; margin-top: auto; border: 1px solid #10b981;">💾 Save Game</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center;">
                    <div id="logo-container" onclick="document.getElementById('gym-pic-upload').click()" style="width: 120px; height: 120px; border: 2px dashed #fbbf24; border-radius: 50%; margin: 0 auto 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0f172a;">
                        <img id="gym-logo-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <span id="pic-placeholder" style="font-size: 0.7rem; color: #94a3b8;">UPLOAD LOGO</span>
                    </div>
                    <input type="file" id="gym-pic-upload" style="display: none;" accept="image/*" onchange="handleLogoUpload(this)">
                    
                    <h2 id="gym-name-display">The Cage Gym</h2>
                    <div id="news-feed" style="background: #0f172a; padding: 15px; border-radius: 8px; margin: 15px 0; min-height: 80px; text-align: left; font-size: 0.85rem;">
                        No recent fight activity.
                    </div>
                    <button id="advance-btn" onclick="processWeekReset()" style="height: 60px; font-size: 1.2rem; background: #ef4444 !important; color: white !important;">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-stable" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">FIGHTER STABLE</h2>
                <div id="stable-list" class="grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px;"></div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <div id="tourney-status"></div>
                <button id="start-clash-btn" onclick="runGymClash()" style="display:none; background: #10b981 !important; color: white !important; margin-bottom: 20px;">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>

            <section id="view-create" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Recruit Workshop Fighter</h3>
                    <p>Cost: 💰500</p>
                    <input type="text" id="new-fighter-name" placeholder="Fighter Name..." style="padding: 10px; width: 100%; margin-bottom: 15px; box-sizing: border-box;">
                    <button onclick="createFighter()" style="background: #fbbf24 !important; color: black !important;">SIGN CONTRACT</button>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CAGE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific Fix for Logo and Clash Pulse */
        #logo-container { width: 80px; height: 80px; border: 2px dashed #fbbf24; border-radius: 50%; margin: 0 auto 10px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; }
        #gym-logo-img { width: 100%; height: 100%; object-fit: cover; }
        .clash-ready { background: #fbbf24 !important; color: #000 !important; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); box-shadow: 0 0 20px #fbbf24; } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1300</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
            <span id="trophy-count" style="color: #fbbf24; margin-left:10px;"></span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable</button>
            <button onclick="showView('create')">➕ Create</button>
            <button onclick="showView('help')">❓ Help</button>
            <button onclick="saveData()" style="color: #10b981; margin-top: auto;">💾 Save</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center;">
                    <div id="logo-container" onclick="document.getElementById('gym-pic-upload').click()">
                        <img id="gym-logo-img" src="" style="display: none;">
                        <span id="pic-placeholder" style="font-size: 0.6rem; color: #94a3b8;">LOGO</span>
                    </div>
                    <input type="file" id="gym-pic-upload" style="display: none;" accept="image/*" onchange="handleLogoUpload(this)">
                    
                    <h2 id="gym-name-display" style="margin-bottom: 5px;">The Cage Gym</h2>
                    <div id="news-feed" style="background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; min-height: 50px; font-size: 0.8rem; text-align: left;">Ready for the season.</div>
                    <button id="advance-btn" onclick="processWeekReset()" style="height: 60px; font-size: 1.1rem; width: 100%; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer;">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-help" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Manager's Manual</h3>
                    <p>• Week 1-23: Fight to earn 💰.</p>
                    <p>• Week 24: Gym Clash.</p>
                    <p>• Week 48: Elite Clash (Win Trophies).</p>
                    <button onclick="forceHeal()" style="background: #3b82f6 !important; margin-top: 20px;">FIX STUCK BUTTONS</button>
                </div>
            </section>

            <section id="view-stable" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">STABLE</h2>
                <div id="stable-list" class="grid-container"></div>
            </section>

            <section id="view-create" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Sign Fighter (💰500)</h3>
                    <input type="text" id="new-fighter-name" placeholder="Name..." style="padding: 12px; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
                    <button onclick="createFighter()">RECRUIT</button>
                </div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <div id="tourney-status"></div>
                <button id="start-clash-btn" onclick="runGymClash()" style="display:none; background: #10b981 !important; height: 50px; width: 100%; margin-bottom: 20px;">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

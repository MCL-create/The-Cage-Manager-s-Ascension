<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CAGE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1300</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
            <span id="trophy-count" style="color: #fbbf24; margin-left:10px;"></span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable</button>
            <button onclick="showView('create')">➕ Create</button>
            <button onclick="showView('help')">❓ Help</button>
            <button onclick="saveData()" style="color: #10b981; margin-top: auto;">💾 Save</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center;">
                    <div id="logo-container" onclick="document.getElementById('gym-pic-upload').click()" style="width: 80px; height: 80px; border: 2px dashed #fbbf24; border-radius: 50%; margin: 0 auto 10px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a;">
                        <img id="gym-logo-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <span id="pic-placeholder" style="font-size: 0.6rem; color: #94a3b8;">LOGO</span>
                    </div>
                    <input type="file" id="gym-pic-upload" style="display: none;" accept="image/*" onchange="handleLogoUpload(this)">
                    
                    <h2 id="gym-name-display" style="margin-bottom: 5px;">The Cage Gym</h2>
                    <div id="news-feed" style="background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; min-height: 40px; font-size: 0.8rem;">Ready for action.</div>
                    <button id="advance-btn" onclick="processWeekReset()" style="height: 50px; font-size: 1rem; background: #ef4444 !important;">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-help" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Manager's Manual</h3>
                    <p>• Week 1-23: Use <b>FIGHT NOW</b> in Stable to earn 💰.</p>
                    <p>• Week 24/48: <b>Gym Clash</b> events.</p>
                    <hr style="border: 0.5px solid #334155; margin: 15px 0;">
                    <button onclick="forceHeal()" style="background: #3b82f6 !important; font-size: 0.8rem;">FIX STUCK BUTTONS (Force Heal)</button>
                </div>
            </section>

            <section id="view-stable" class="view" style="display:none;">
                <div id="stable-list" class="grid-container"></div>
            </section>

            <section id="view-create" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Recruit Fighter</h3>
                    <input type="text" id="new-fighter-name" placeholder="Name..." style="padding: 10px; width: 80%; margin-bottom: 10px;">
                    <button onclick="createFighter()">Sign (💰500)</button>
                </div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <div id="tourney-status"></div>
                <button id="start-clash-btn" onclick="runGymClash()" style="display:none; background: #10b981 !important;">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CAGE - GYM MANAGER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="stats-bar">
            <span>⚡ <b id="energy-val">15/15</b></span>
            <span>💰 <b id="points-val">1300</b></span>
            <span>📅 Wk: <b id="week-val">1</b></span>
            <span id="trophy-count" style="color: #fbbf24; font-weight: bold;"></span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <button onclick="showView('dashboard')">🏠 Home</button>
            <button onclick="showView('stable')">🥋 Stable (FIGHT)</button>
            <button onclick="showView('market')">🛒 Market</button>
            <button onclick="showView('create')">➕ Create</button>
            <button onclick="saveData()" style="color: #10b981; margin-top: auto; border: 1px solid #10b981;">💾 Save Game</button>
        </aside>

        <main id="main-content">
            <section id="view-dashboard" class="view">
                <div class="action-card" style="text-align: center;">
                    <div id="logo-container" onclick="document.getElementById('gym-pic-upload').click()">
                        <img id="gym-logo-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <span id="pic-placeholder">UPLOAD LOGO</span>
                    </div>
                    <input type="file" id="gym-pic-upload" style="display: none;" accept="image/*" onchange="handleLogoUpload(this)">
                    
                    <h2 id="gym-name-display">The Cage Gym</h2>
                    
                    <div class="news-container">
                        <h3>FIGHT HISTORY</h3>
                        <div id="news-feed">No fights yet this season.</div>
                    </div>

                    <button class="advance-btn" onclick="processWeekReset()">ADVANCE WEEK</button>
                </div>
            </section>

            <section id="view-stable" class="view" style="display:none;">
                <h2 style="color: #fbbf24;">YOUR STABLE</h2>
                <div id="stable-list" class="grid-container"></div>
            </section>

            <section id="view-tournament" class="view" style="display:none;">
                <div id="tourney-status"></div>
                <button id="start-clash-btn" onclick="runGymClash()" style="display:none; background: #10b981 !important; height: 50px; margin-bottom: 20px;">START CLASH</button>
                <div id="tourney-roster" class="grid-container"></div>
            </section>

            <section id="view-create" class="view" style="display:none;">
                <div class="action-card">
                    <h3>Recruit Workshop Fighter</h3>
                    <p>Cost: 💰500</p>
                    <input type="text" id="new-fighter-name" placeholder="Enter Fighter Name..." style="padding: 10px; width: 80%; margin-bottom: 15px;">
                    <button onclick="createFighter()">SIGN CONTRACT</button>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
